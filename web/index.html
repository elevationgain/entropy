<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entropy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" id="favicon" type="image/svg+xml" href="">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #070b08; --panel: #0a110c; --rule: #1c2e22; --rule-strong: #2f5a3d;
    --fg: #b8f5c8; --bright: #e6ffe9; --dim: #8cc79d; --faint: #5e9470;
    --amber: #ffb547; --amber-dim: #6b4a17; --amber-bg: #110c04; --amber-strip: #1c1406; --amber-text: #ffeccc;
    --cyan: #6fe3ff; --cyan-dim: #1b4652; --cyan-bg: #060f12; --cyan-strip: #0a1b20; --cyan-text: #c9f4ff;
    --ended: #6d7f72; --red: #ff6b5e; --violet: #c9a2ff; --link: #9db4ff;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: "Geist", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { min-height: 100vh; color: var(--fg); font: 12px/1.4 var(--mono); -webkit-font-smoothing: antialiased; }
  body.crt-full { text-shadow: 0 0 4px; }
  body.crt-low { text-shadow: 0 0 2px; }
  a { color: var(--link); text-decoration: none; }
  a[href]:hover { color: #c8d6ff; text-decoration: underline; }
  ::selection { background: var(--fg); color: var(--bg); text-shadow: none; }
  button { all: unset; cursor: pointer; }

  @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
  @keyframes flicker { 0%{opacity:.92} 7%{opacity:.8} 8%{opacity:.96} 38%{opacity:.9} 39%{opacity:1} 40%{opacity:.88} 71%{opacity:.93} 72%{opacity:.7} 73%{opacity:.95} 100%{opacity:.92} }
  @keyframes roll { from { transform: translateY(-30vh) } to { transform: translateY(130vh) } }

  /* CRT overlay */
  #crt { position: fixed; inset: 0; pointer-events: none; z-index: 50; display: none; }
  body.crt-full #crt, body.crt-low #crt { display: block; }
  #crt .lines { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 1px, transparent 1px 3px); }
  body.crt-full #crt .lines { background: repeating-linear-gradient(0deg, rgba(0,0,0,.34) 0 1px, transparent 1px 3px); animation: flicker 5.3s linear infinite; }
  #crt .roll { position: absolute; left: 0; right: 0; top: 0; height: 24vh; display: none;
    background: linear-gradient(180deg, transparent, rgba(184,245,200,.045), transparent); animation: roll 7.5s linear infinite; }
  body.crt-full #crt .roll { display: block; }
  body.crt-full #crt .tint { position: absolute; inset: 0; background: rgba(120,255,160,.012); mix-blend-mode: screen; }
  body.still #crt .lines, body.still #crt .roll { animation: none; }
  body.still #crt .roll { display: none; }

  /* Header */
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule-strong); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 12px 20px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand b { font-weight: 700; font-size: 15px; letter-spacing: .16em; color: var(--bright); }
  .brand span { color: var(--faint); letter-spacing: .14em; }
  .cursor { display: inline-block; width: .62em; height: 1.05em; background: var(--fg); box-shadow: 0 0 6px var(--fg);
    vertical-align: -.16em; margin-left: 2px; animation: blink 1.06s steps(1) infinite; }
  body.crt-off .cursor, body.still .cursor { animation: none; }
  #mark { width: 24px; height: 20px; flex: none; }
  #mark svg { display: block; overflow: visible; }
  .spacer { flex: 1; }
  .toggles { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .tg { display: flex; align-items: center; gap: 6px; }
  .tg > span { font-size: 9px; letter-spacing: .14em; color: var(--faint); }
  .seg { display: flex; border: 1px solid var(--rule-strong); }
  .seg button { padding: 3px 9px; font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--faint); }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); text-shadow: none; }
  .seg button:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
  .conn { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .08em; color: var(--faint); }
  .conn i { width: 7px; height: 7px; background: currentColor; }
  #connLabel { color: var(--fg); display: flex; align-items: center; gap: 8px; }
  #connLabel.down { color: var(--red); }
  #connLabel.demo { color: var(--amber); }

  #counters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid var(--rule); }
  .ctr { display: flex; align-items: baseline; gap: 10px; padding: 10px 20px; border-right: 1px solid var(--rule); color: var(--faint); }
  .ctr .n { font-size: 28px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
  .ctr .l { display: flex; flex-direction: column; gap: 2px; }
  .ctr .l b { font-size: 10px; font-weight: 600; letter-spacing: .16em; }
  .ctr .l span { font-size: 10px; letter-spacing: .08em; color: var(--faint); }
  .ctr.needs_input.has { color: var(--amber); background: #130d04; }
  .ctr.working.has { color: var(--cyan); }
  .ctr.idle.has { color: var(--fg); }
  .ctr.ended { color: var(--ended); }

  /* Board */
  #board { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; }
  /* Board = horizontal swimlanes: one full-width lane per status, label column on the left,
     cards wrapping left to right. Below 900px the label stacks on top (same as list). */
  @media (min-width: 900px) {
    body.board .sec { display: grid; grid-template-columns: 168px minmax(0, 1fr); border-bottom: 1px solid var(--rule-strong); }
    body.board .sec-head { flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px 20px;
      border-bottom: 0; border-right: 1px solid var(--rule); }
    body.board .sec-head .meta { margin-left: 0; order: 3; }
    body.board .sec-head .cnt { order: 2; font-size: 28px; line-height: 1; letter-spacing: -.02em; }
    body.board .sec.needs_input.has .sec-head { background: var(--amber-strip); box-shadow: inset 3px 0 0 var(--amber); }
    body.board .sec.working.has .sec-head { box-shadow: inset 3px 0 0 var(--cyan); }
    body.board .sec .empty { align-self: center; }
    body.board .sec.ended .sec-head { opacity: .7; }
  }
  body.list #board { max-width: 920px; }
  body.list .cards { grid-template-columns: minmax(0, 1fr) !important; }

  .sec { border-bottom: 1px solid var(--rule); min-width: 0; }
  .sec-head { display: flex; align-items: center; gap: 10px; padding: 8px 20px; background: #0c140f; border-bottom: 1px solid var(--rule);
    font-size: 11px; font-weight: 600; letter-spacing: .18em; }
  .sec-head .meta { margin-left: auto; font-weight: 500; letter-spacing: .08em; color: var(--faint); }
  .sec.needs_input .sec-head { color: var(--amber); }
  .sec.working .sec-head { color: var(--cyan); }
  .sec.idle .sec-head { color: var(--fg); }
  .sec.ended .sec-head { color: var(--ended); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 14px; padding: 14px 20px 18px; align-items: start; }
  .sec-head[data-lane] { cursor: pointer; user-select: none; }
  .sec-head[data-lane]:hover { filter: brightness(1.25); }
  .sec-head[data-lane]:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
  .chev { display: inline-block; width: 1em; color: var(--faint); }
  .minis { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px; align-self: center; min-width: 0; }
  .card.mini { flex-direction: row; align-items: center; gap: 8px; padding: 4px 10px; max-width: 360px; font-size: 11px; }
  .card.mini .ws { width: 3px; align-self: stretch; background: var(--wc-lite, var(--rule)); flex: none; }
  .card.mini .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--bright); }
  .card.mini .age { flex: none; font-size: 10px; color: var(--faint); }
  .card.mini.needs_input .age { color: var(--amber); }
  .card.mini.prio-urgent .t { color: var(--red); }
  .empty { padding: 14px 20px; font-size: 11px; letter-spacing: .08em; color: var(--faint); }

  /* Card */
  .card { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--rule); background: var(--panel); cursor: pointer; transition: filter 150ms; }
  .card:hover { filter: brightness(1.22); }
  .card:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
  .strip { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--rule); background: #0e1a12;
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .strip .g { font-weight: 700; flex: none; }
  .strip .ws { width: 8px; height: 8px; flex: none; background: var(--rule); }
  .strip .sub { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strip .age { flex: none; font-size: 12px; font-weight: 600; letter-spacing: .04em; }
  .body { display: flex; flex-direction: column; gap: 10px; padding: 11px 12px 12px; }
  .title { font-size: 15px; font-weight: 600; line-height: 1.3; text-wrap: pretty; overflow-wrap: anywhere; }

  .card.needs_input { border-color: var(--amber-dim); background: var(--amber-bg); }
  .card.needs_input .strip { border-color: var(--amber-dim); background: var(--amber-strip); color: #d9a867; }
  .card.needs_input .g, .card.needs_input .age { color: var(--amber); }
  .card.needs_input .title { color: var(--bright); }
  .card.working { border-color: var(--cyan-dim); background: var(--cyan-bg); }
  .card.working .strip { border-color: var(--cyan-dim); background: var(--cyan-strip); color: #7fb9c6; }
  .card.working .g, .card.working .age { color: var(--cyan); }
  .card.idle .g, .card.idle .age { color: var(--fg); }
  .card.ended { opacity: .6; }
  .card.ended .strip { background: #0d140f; }
  .card.ended .g, .card.ended .age { color: var(--ended); }
  .card.ended .title { color: var(--dim); }

  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  /* cmux workspace color, lifted a little so dark sidebar hues read on the phosphor background */
  .card[style*="--wc"] { --wc-lite: color-mix(in srgb, var(--wc) 72%, #ffffff 28%); }
  .strip .ws { background: var(--wc-lite, var(--rule)); }
  .tag.pill { color: var(--pc, var(--dim)); border-color: color-mix(in srgb, var(--pc, #5e9470) 45%, transparent); }
  .tag { font-size: 11px; line-height: 18px; padding: 0 6px; border: 1px solid var(--rule); color: var(--dim);
    white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .tag.alt { color: var(--violet); border-color: #4a3a66; }
  .tag.mode { color: var(--cyan); border-color: var(--cyan-dim); }
  .tag.git { color: var(--bright); }
  .tag.link { color: var(--link); border-color: #2c3a66; }
  .tag.warn { color: var(--red); border-color: #5a2520; }
  .tag.prio { font-weight: 700; text-shadow: none; }
  .tag.prio.urgent { color: #1a0402; background: var(--red); border-color: var(--red); }
  .tag.prio.high { color: #120c02; background: var(--amber); border-color: var(--amber); }
  .tag.prio.low { color: var(--faint); border-style: dashed; }
  .prio-reason { font-size: 11px; font-weight: 600; letter-spacing: .06em; display: flex; gap: 8px; align-items: baseline; }
  .prio-reason.urgent { color: var(--red); } .prio-reason.high { color: var(--amber); } .prio-reason.low { color: var(--faint); font-weight: 400; }
  .prio-reason .when { font-size: 10px; color: var(--faint); font-weight: 400; }
  .card.prio-urgent { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), 0 0 22px #ff6b5e40; }
  .card.prio-low { opacity: .72; }

  .co { border: 1px solid var(--amber); background: #1a1206; }
  .co-bar { display: flex; align-items: center; gap: 8px; padding: 3px 8px; background: var(--amber); color: #120c02;
    font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; text-shadow: none; }
  .co-bar .lbl { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .co-bar .m { margin-left: auto; flex: none; }
  .co-text { padding: 8px 10px 0; margin-bottom: 8px; font: 13px/1.5 var(--sans); color: var(--amber-text); text-wrap: pretty;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; }
  .co-code { padding: 7px 10px 0; margin-bottom: 7px; font-size: 11.5px; line-height: 1.45; color: var(--amber-text); white-space: pre-wrap; word-break: break-all;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .opts { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 10px 9px; }
  .opt { font-size: 11px; padding: 1px 7px; border: 1px solid var(--amber-dim); color: #ffe2b0; }
  .opt.ghost { border-style: dashed; color: var(--faint); }
  .co.run { border-color: var(--cyan-dim); background: #07161a; }
  .co.run .co-bar { background: var(--cyan-dim); color: var(--cyan-text); }
  .co.run .co-code, .co.run .co-text { color: var(--cyan-text); }
  .co.run .spin { color: var(--cyan); }
  .tw-cur { display: inline-block; width: .55em; height: 1.05em; background: currentColor; vertical-align: -.18em; margin-left: 1px; box-shadow: 0 0 6px currentColor; }
  .spin { display: inline-block; width: 1.1em; text-align: center; }

  .todos { display: flex; flex-direction: column; gap: 4px; }
  .todos .row { display: flex; align-items: center; gap: 8px; }
  .segs { flex: 1; display: flex; gap: 2px; height: 8px; }
  .segs i { flex: 1; background: var(--rule); }
  .segs i.on { background: var(--fg); }
  .todos span { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .detail { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--rule); padding-top: 10px; }
  body.compact .detail { display: none; }
  .line { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
  .line > i { font-style: normal; font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--dim); }
  .line > i.claude { color: var(--fg); }
  .line > i.notif { color: var(--faint); }
  .line p { margin: 0; font: 12.5px/1.45 var(--sans); color: #a9d9b5; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .line .when, .kv .when { font-size: 10px; color: var(--faint); }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
  .stat { display: flex; flex-direction: column; gap: 1px; padding: 4px 7px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .stat i { font-style: normal; font-size: 9px; letter-spacing: .12em; color: var(--faint); }
  .stat b { font-size: 12px; font-weight: 500; }
  .stat.err b { color: var(--red); }
  .kv { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 11px; }
  .kv i { font-style: normal; font-size: 9px; letter-spacing: .12em; color: var(--faint); }
  .kv span:not(.when) { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kv.dim span:not(.when) { color: var(--faint); }

  footer { padding: 14px 20px 24px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 10px; letter-spacing: .12em; color: var(--faint); }

  /* Workspace-colored cards: when a cmux workspace has a color, it becomes the card's primary
     color (frame, strip, tint, title) so you can tell tasks apart at a glance. The lane already
     says the status; callout bars, glyph and age keep their status colors inside the card.
     Declared last so it wins over the per-status card colors. */
  .card.wc {
    --wc-ink: color-mix(in srgb, var(--wc) 38%, #ffffff 62%);
    border-color: color-mix(in srgb, var(--wc-lite) 70%, transparent);
    background: color-mix(in srgb, var(--wc) 12%, var(--bg));
  }
  .card.wc .strip { background: color-mix(in srgb, var(--wc) 30%, var(--bg)); border-color: color-mix(in srgb, var(--wc-lite) 45%, transparent); color: var(--wc-ink); }
  .card.wc .title { color: var(--wc-ink); }
  .card.wc .detail { border-top-color: color-mix(in srgb, var(--wc-lite) 30%, transparent); }
  .card.wc.prio-urgent { border-color: var(--red); }
  .card.mini.wc { background: color-mix(in srgb, var(--wc) 16%, var(--bg)); border-color: color-mix(in srgb, var(--wc-lite) 60%, transparent); }
  .card.mini.wc .t { color: var(--wc-ink); }
</style>
</head>
<body class="board full crt-full">
<div id="crt"><div class="lines"></div><div class="roll"></div><div class="tint"></div></div>
<header>
  <div class="bar">
    <div class="brand"><span id="mark" title="Entropy"></span><b>ENTROPY</b><span>:: AGENT HUD</span><i class="cursor"></i></div>
    <div class="spacer"></div>
    <div class="toggles">
      <div class="tg"><span>VIEW</span><div class="seg"><button data-layout="board">BOARD</button><button data-layout="list">LIST</button></div></div>
      <div class="tg"><span>DENSITY</span><div class="seg"><button data-density="full">FULL</button><button data-density="compact">COMPACT</button></div></div>
      <div class="tg"><span>CRT</span><div class="seg"><button data-crt="crt-full">FULL</button><button data-crt="crt-low">LOW</button><button data-crt="crt-off">OFF</button></div></div>
    </div>
    <div class="conn"><span id="connLabel"><i></i><span id="connText">CONNECTING…</span></span><span>·</span><span id="clock"></span></div>
  </div>
  <div id="counters"></div>
</header>
<main id="board"></main>
<footer><span>ENTER / CLICK → JUMP TO SURFACE</span><span id="status"></span></footer>

<script>
const ORDER = ["needs_input", "working", "idle", "ended"];
const LABEL = { needs_input: "NEEDS YOU", working: "WORKING", idle: "IDLE", ended: "ENDED" };
const GLYPH = { needs_input: "[!]", idle: "[_]", ended: "[x]" };
const SPIN = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";
const TYPE_SPEED = 260;  // chars/sec
const TYPE_WINDOW = 3000; // text first seen within this many ms still types out
let state = null, recvAt = 0, prevStatus = null, prevNeeds = 0, mode = "connecting";
const firstSeen = new Map();

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduced) document.body.classList.add("still");
const fx = () => !reduced && !document.body.classList.contains("crt-off");
const serverNow = () => (state ? state.now + (Date.now() / 1000 - recvAt) : Date.now() / 1000);

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dec = (s) => String(s ?? "").replace(/&(amp|lt|gt|quot|#39);/g, (m, k) => ({ amp: "&", lt: "<", gt: ">", quot: '"', "#39": "'" }[k]));
const plain = (s) => dec(s).replace(/\*\*|__|`/g, "").replace(/(^|\s)#+\s*/g, "$1").replace(/\s+/g, " ").trim();
const clip = (s, n) => (s.length > n ? s.slice(0, n).replace(/\s+\S*$/, "") + "…" : s);
const kfmt = (n) => (!n ? "" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n));
const model = (m) => (m || "").replace(/^claude-/, "");
function ago(secs) {
  const s = Math.max(0, Math.floor(secs));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h" + String(m % 60).padStart(2, "0") + "m";
  return Math.floor(h / 24) + "d" + (h % 24) + "h";
}
const since = (t, prefix = "") => (t ? `<span data-since="${t}" data-prefix="${esc(prefix)}">${esc(prefix + ago(serverNow() - t))}</span>` : "");
const spin = () => `<span class="spin">${fx() ? SPIN[0] : "▶"}</span>`;
const tag = (text, cls = "", title = "", href = "") => !text ? "" : href
  ? `<a class="tag ${cls}" href="${esc(href)}" target="_blank" rel="noopener" title="${esc(title)}">${esc(text)}</a>`
  : `<span class="tag ${cls}" title="${esc(title)}">${esc(text)}</span>`;
const HEX = /^#[0-9a-f]{3,8}$/i;
const hex = (c) => (c && HEX.test(c) ? c : "");
// cmux sidebar status pills (account wrapper etc.), in their own colors.
const pill = (p) => { const c = hex(p.color);
  return `<span class="tag pill" ${c ? `style="--pc:${c}"` : ""} title="${esc(p.key)}">${esc(p.value)}</span>`; };

// Typewriter target: text is rendered by the typing loop, keyed so re-renders don't restart it.
const tw = (key, text, delay = 0) => {
  if (!firstSeen.has(key)) firstSeen.set(key, Date.now() + delay);
  return `<span data-tw="${esc(key)}" data-text="${esc(text)}">${esc(text)}</span>`;
};

function callout(r, status, t, h, note, idx) {
  const key = (s) => r.sid + "|co|" + s.slice(0, 50);
  if (status === "needs_input") {
    if (t.question) {
      const q = clip(dec(t.question.text), 320);
      const opts = t.question.options.map((o) => `<span class="opt">${esc(o)}</span>`).join("") +
        (t.question.more ? `<span class="opt ghost">+${t.question.more} more</span>` : "");
      return `<div class="co"><div class="co-bar"><span class="lbl">? Asking</span></div><div class="co-text">${tw(key(q), q, idx * 280)}</div><div class="opts">${opts}</div></div>`;
    }
    if (t.plan) { const p = clip(plain(t.plan), 360); return `<div class="co"><div class="co-bar"><span class="lbl">Plan ready for review</span></div><div class="co-text">${tw(key(p), p, idx * 280)}</div></div>`; }
    if (t.pending_tool) return `<div class="co"><div class="co-bar"><span class="lbl">Wants to run ${esc(t.pending_tool.name)}</span><span class="m">approve?</span></div><div class="co-code">$ ${esc(t.pending_tool.summary)}</div></div>`;
    const said = t.last_reply || note?.body;
    if (said) { const s = clip(plain(said), 360); return `<div class="co"><div class="co-bar"><span class="lbl">${r.attention === "done_unread" ? "Done · unread" : "Waiting on you · last said"}</span></div><div class="co-text">${tw(key(s), s, idx * 280)}</div></div>`; }
    return "";
  }
  if (status === "working") {
    const tool = t.pending_tool || (h.tool ? { name: h.tool, summary: "" } : null);
    return `<div class="co run"><div class="co-bar"><span class="lbl">${spin()}${esc(tool ? tool.name : "Thinking…")}</span><span class="m">${since(h.turn_started, "turn ")}</span></div>${tool?.summary ? `<div class="co-code">$ ${esc(tool.summary)}</div>` : ""}</div>`;
  }
  return "";
}

function card(r, status, idx) {
  const d = r.detail || {};
  const t = d.transcript || {}, h = d.hook || {}, s = d.session || {}, p = d.proc || {};
  const w = d.workspace || {}, g = d.git || {}, note = d.notification;
  const now = serverNow();
  const title = dec(r.title || t.ai_title || r.repo || r.kind);
  const sub = [r.ws];
  if (r.repo && r.repo !== r.ws) sub.push(r.repo);
  if (w.group && w.group !== r.ws) sub.push(w.group);
  if (r.kind && r.kind !== "claude") sub.push(r.kind);
  if (state.windows > 2 && w.window) sub.push("win " + w.window);

  const pr = r.priority && typeof r.priority === "object" ? r.priority : null;
  const branch = [g.branch, w.branch, t.git_branch].find((b) => b && b !== "HEAD" && b !== "(detached)");
  const gitBits = branch ? "⎇ " + branch + (g.changed ? ` +${g.changed}` : w.dirty ? "*" : "") +
    (g.ahead ? ` ↑${g.ahead}` : "") + (g.behind ? ` ↓${g.behind}` : "") : "";
  const prs = [...new Set([t.pr?.url, ...(w.prs || [])].filter(Boolean))];
  const tags = [
    pr ? tag((pr.level === "low" ? "▼ " : "!! ") + pr.level.toUpperCase(), "prio " + pr.level,
      pr.sticky ? "sticky priority" : "clears when you next prompt this session") : "",
    ...(w.pills || []).map(pill),
    w.pills?.length ? "" : tag(s.account, s.account && s.account !== "default" ? "alt" : "", "Claude account"),
    tag([model(t.model), t.effort].filter(Boolean).join(" · "), "", "model · effort"),
    t.permission_mode && t.permission_mode !== "default" ? tag(t.permission_mode, "mode", "permission mode") : "",
    t.mode && t.mode !== "normal" ? tag(t.mode, "mode") : "",
    tag(gitBits, "git", g.last_commit ? "last commit: " + g.last_commit : ""),
    ...prs.map((u) => tag("PR #" + u.split("/").pop(), "link", "", u)),
    ...(w.ports || []).map((port) => tag(":" + port, "link", "", "http://localhost:" + port)),
    w.unread ? tag(w.unread + " unread", "warn") : "",
    w.remote ? tag(String(w.remote), "", "remote target") : "",
  ].join("");

  const co = callout(r, status, t, h, note, idx);
  const todos = t.todos ? (() => {
    const n = Math.min(t.todos.total, 24), on = Math.round((t.todos.done / Math.max(1, t.todos.total)) * n);
    return `<div class="todos"><div class="row"><div class="segs">${Array.from({ length: n }, (_, i) => `<i class="${i < on ? "on" : ""}"></i>`).join("")}</div><span>${t.todos.done}/${t.todos.total}</span></div>${t.todos.active ? `<span>› ${esc(t.todos.active)}</span>` : ""}</div>`;
  })() : "";

  const you = t.last_user || t.last_prompt;
  const showReply = t.last_reply && !(status === "needs_input" && !t.question && !t.plan && !t.pending_tool);
  let lines = "";
  if (you) lines += `<div class="line"><i>YOU</i><p>${esc(clip(dec(you), 240))}</p><span class="when">${since(t.last_user_at)}</span></div>`;
  if (showReply) { const txt = clip(plain(t.last_reply), 300); lines += `<div class="line"><i class="claude">CLAUDE</i><p>${tw(r.sid + "|re|" + txt.slice(0, 50), txt)}</p><span class="when">${since(t.last_assistant_at)}</span></div>`; }
  if (note?.body && note.body !== t.last_reply) {
    const nb = plain(note.body);
    if (!(t.last_reply && plain(t.last_reply).startsWith(nb.replace(/…$/, "").slice(0, 60))))
      lines += `<div class="line"><i class="notif">NOTIF</i><p>${esc(clip(nb, 200))}</p><span class="when">${since(note.at)}</span></div>`;
  }

  const stat = (k, v, title = "", cls = "") => (v === "" || v == null || v === 0 || v === "0" ? "" :
    `<div class="stat ${cls}" title="${esc(title)}"><i>${k}</i><b>${esc(v)}</b></div>`);
  const toolsTotal = h.tool_calls || (t.top_tools || []).reduce((a, [, n]) => a + n, 0);
  const stats = [
    stat("CTX", kfmt(t.context_tokens), "tokens in context on the last request"),
    stat("OUT", kfmt(t.output_tokens), "output tokens this session"),
    stat("TURNS", t.turns || h.prompts),
    stat("TOOLS", toolsTotal || "", (t.top_tools || []).map(([n, c]) => `${n} ${c}`).join(", ")),
    stat("ERRS", t.tool_errors || h.tool_errors || "", "", "err"),
    stat("SUBAG", h.subagents_done || "", "subagents completed"),
    stat("LAST", t.last_turn_ms ? ago(t.last_turn_ms / 1000) : "", "last turn duration"),
    stat("UP", s.started_at ? ago(now - s.started_at) : "", "session age"),
    stat("CPU", p.cpu != null ? p.cpu + "%" : ""),
    stat("MEM", p.rss_mb != null ? p.rss_mb + "M" : ""),
    stat("PROCS", p.children || "", "child processes"),
    stat("PID", s.pid),
  ].join("");

  const kv = (k, v, when = "", cls = "") => `<div class="kv ${cls}"><i>${k}</i><span>${esc(v)}</span><span class="when">${when}</span></div>`;
  let meta = "";
  if (t.recent_files?.length) meta += kv("EDITED " + t.files_edited, t.recent_files.join(", "));
  if (g.last_commit) meta += kv("COMMIT", g.last_commit, since(g.last_commit_at));
  if (w.description) meta += kv("ABOUT", w.description);
  const ver = [t.version && "v" + t.version, t.entrypoint].filter(Boolean).join(" · ");
  if (ver) meta += kv("BUILD", ver, "", "dim");

  const detail = lines || stats || meta ? `<div class="detail">${lines}${stats ? `<div class="stats">${stats}</div>` : ""}${meta}</div>` : "";
  const glyph = status === "working" ? spin() : GLYPH[status];

  const wc = hex(r.color);
  return `<div class="card ${status}${pr ? " prio-" + esc(pr.level) : ""}${wc ? " wc" : ""}" ${wc ? `style="--wc:${wc}"` : ""} tabindex="0" role="button" data-sid="${esc(r.sid)}" data-wid="${esc(r.wid)}" data-surface="${esc(r.surface)}" title="${esc(r.cwd || "")}">
    <div class="strip"><span class="g">${glyph}</span><span class="ws"></span><span class="sub">${esc(sub.join(" / "))}</span><span class="age">${since(status === "ended" ? r.last : r.since)}</span></div>
    <div class="body">
      <div class="title">${esc(title)}</div>
      ${tags ? `<div class="tags">${tags}</div>` : ""}
      ${pr?.reason ? `<div class="prio-reason ${esc(pr.level)}">${pr.level === "low" ? "▼" : "!!"} ${esc(pr.reason)} <span class="when">${since(pr.set_at)}</span></div>` : ""}
      ${co}${todos}${detail}
    </div>
  </div>`;
}

// Collapsed lanes show one clickable chip per agent instead of full cards.
let collapsed = new Set();
try { collapsed = new Set(JSON.parse(localStorage.getItem("hud.collapsed") || "[]")); } catch {}
function toggleLane(k) {
  collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k);
  try { localStorage.setItem("hud.collapsed", JSON.stringify([...collapsed])); } catch {}
  render();
}
function mini(r, status) {
  const wc = hex(r.color), t = r.detail?.transcript || {};
  const title = dec(r.title || t.ai_title || r.repo || r.kind);
  const lvl = r.priority?.level;
  return `<div class="card mini ${status}${lvl ? " prio-" + esc(lvl) : ""}${wc ? " wc" : ""}" tabindex="0" role="button" data-sid="${esc(r.sid)}"
      data-wid="${esc(r.wid)}" data-surface="${esc(r.surface)}" ${wc ? `style="--wc:${wc}"` : ""} title="${esc(r.ws)}">
    <span class="ws"></span><span class="t">${lvl && lvl !== "low" ? "!! " : ""}${esc(title)}</span>
    <span class="age">${since(status === "ended" ? r.last : r.since)}</span></div>`;
}

function render() {
  if (!state) return;
  const { groups, totals } = state;
  const now = serverNow();
  const needs = groups.needs_input || [];
  const oldest = needs.length ? Math.min(...needs.map((r) => r.since)) : 0;
  const working = groups.working || [];

  const ctr = (k, n, meta) => `<div class="ctr ${k} ${n ? "has" : ""}"><span class="n">${n}</span><span class="l"><b>${k === "working" && n ? spin() : k === "working" ? "▶" : GLYPH[k]} ${LABEL[k]}</b><span>${meta}</span></span></div>`;
  document.getElementById("counters").innerHTML =
    ctr("needs_input", totals.needs_input || 0, oldest ? since(oldest, "oldest ") : "all clear") +
    ctr("working", totals.working || 0, esc(working.map((r) => r.detail?.hook?.tool).filter(Boolean).join(" · ") || "—")) +
    ctr("idle", totals.idle || 0, "ready") +
    ctr("ended", totals.ended || 0, "session closed");

  const status = {};
  document.getElementById("board").innerHTML = ORDER.map((k) => {
    const items = (groups[k] || []).slice();
    items.forEach((r) => (status[r.sid] = k));
    const total = totals[k] ?? items.length;
    const n = total > items.length ? `${items.length}/${total}` : String(total || 0);
    const glyph = k === "working" && items.length ? spin() : k === "needs_input" ? "▌" : "·";
    const meta = k === "needs_input" && oldest ? `<span class="meta">${since(oldest, "oldest ")}</span>` : `<span class="meta"></span>`;
    const empty = k === "needs_input" ? "ALL CLEAR — NOTHING IS WAITING ON YOU." : "— NONE";
    const shut = collapsed.has(k);
    const body = !items.length ? `<div class="empty">${empty}</div>`
      : shut ? `<div class="minis">${items.map((r) => mini(r, k)).join("")}</div>`
      : `<div class="cards">${items.map((r, i) => card(r, k, i)).join("")}</div>`;
    return `<section class="sec ${k}${items.length ? " has" : ""}${shut ? " collapsed" : ""}">
      <div class="sec-head" role="button" tabindex="0" aria-expanded="${!shut}" data-lane="${k}" title="${shut ? "expand" : "collapse"} lane">
        <span><span class="chev">${shut ? "▸" : "▾"}</span> ${glyph} ${LABEL[k]}</span>${meta}<span class="cnt">${n}</span></div>
      ${body}
    </section>`;
  }).join("");

  const needsNow = totals.needs_input || 0;
  if (prevStatus && needsNow > prevNeeds) glitchMark();
  prevNeeds = needsNow;
  setFavicon(needsNow ? "#ffb547" : "#b8f5c8");
  if (prevStatus && fx()) for (const sid in status) if (prevStatus[sid] && prevStatus[sid] !== status[sid]) glitch(sid);
  prevStatus = status;

  document.getElementById("status").textContent = state.status || "";
  document.title = totals.needs_input ? `(${totals.needs_input}) Entropy` : "Entropy";
  typeFrame();
  tick();
}

function glitch(sid) {
  const el = document.querySelector(`.card[data-sid="${CSS.escape(sid)}"]`);
  el?.animate?.([
    { transform: "none", filter: "none", clipPath: "inset(0 0 0 0)" },
    { transform: "translate(-4px,1px) skewX(-6deg)", clipPath: "inset(12% 0 52% 0)", filter: "hue-rotate(80deg) saturate(2)" },
    { transform: "translate(5px,-1px)", clipPath: "inset(58% 0 8% 0)", filter: "brightness(1.8)" },
    { transform: "translate(-2px,0) skewX(3deg)", clipPath: "inset(30% 0 30% 0)", filter: "hue-rotate(-60deg)" },
    { transform: "translate(1px,0)", clipPath: "inset(0 0 0 0)", filter: "brightness(1.3)" },
    { transform: "none", filter: "none", clipPath: "inset(0 0 0 0)" },
  ], { duration: 520, easing: "steps(6, end)" });
}

// Typewriter loop: each [data-tw] shows a prefix based on time since its text was first seen.
function typeFrame() {
  const nowMs = Date.now();
  for (const el of document.querySelectorAll("[data-tw]")) {
    const text = el.dataset.text, start = firstSeen.get(el.dataset.tw) ?? 0;
    const fresh = fx() && !document.hidden && nowMs - start < TYPE_WINDOW + text.length / TYPE_SPEED * 1000;
    const n = fresh ? Math.min(text.length, Math.max(0, Math.floor(((nowMs - start) / 1000) * TYPE_SPEED))) : text.length;
    if (el.dataset.n === String(n)) continue;
    el.dataset.n = n;
    el.innerHTML = esc(text.slice(0, n)) + (n < text.length ? '<span class="tw-cur"></span>' : "");
  }
}
setInterval(typeFrame, 24);

let spinI = 0;
setInterval(() => {
  if (!fx()) return;
  spinI = (spinI + 1) % SPIN.length;
  for (const el of document.querySelectorAll(".spin")) el.textContent = SPIN[spinI];
}, 90);

function tick() {
  const now = serverNow();
  for (const el of document.querySelectorAll("[data-since]")) {
    const t = parseFloat(el.dataset.since);
    el.textContent = t ? (el.dataset.prefix || "") + ago(now - t) : "";
  }
  document.getElementById("clock").textContent =
    (state ? `${state.workspaceCount} WS · ${state.windows} WIN · ` : "") + new Date().toLocaleTimeString([], { hour12: false });
}
setInterval(tick, 1000);

// Entropy mark, "F · Sliced" (Claude Design): a 16×20 E in a 24×20 box, a few rows slipped at
// rest. Glitches on load and when an agent newly needs you, not on a timer; motion = look here.
const MARK_W = 24, MARK_H = 20, MARK_X = 2;
const eMask = (x, y) => x < 4 || (y < 4 && x < 16) || (y >= 8 && y < 12 && x < 13) || y >= 16 && x < 16;
const SLICED = Object.assign(Array(MARK_H).fill(0), { 1: 2, 2: 2, 9: 3, 10: 3, 13: -2, 17: -2, 18: -2 });
function markRects(dx, drop, off, fill, onlyShifted, y0 = 0) {
  let out = "";
  for (let y = 0; y < MARK_H; y++) {
    if (onlyShifted && !dx[y]) continue;
    for (let x = 0; x < 16; x++) if (eMask(x, y) && !drop.has(x + "," + y))
      out += `<rect x="${MARK_X + x + dx[y] + off}" y="${y + y0}" width="1" height="1" fill="${fill}"/>`;
  }
  return out;
}
const markEl = document.getElementById("mark");
function drawMark(glitching) {
  let dx = SLICED, drop = new Set(), hot = false;
  if (glitching) {
    const rnd = () => (Math.random() < .5 ? -1 : 1) * (1 + Math.floor(Math.random() * 3));
    dx = Array(MARK_H).fill(0);
    for (let y = 0; y < MARK_H; y += 2) dx[y] = dx[y + 1] = Math.random() < .35 ? rnd() : 0;
    for (let y = 0; y < MARK_H; y++) for (let x = 0; x < 16; x++) if (Math.random() < .08) drop.add(x + "," + y);
    hot = Math.random() < .3;
  }
  markEl.innerHTML = `<svg viewBox="0 0 ${MARK_W} ${MARK_H}" width="100%" height="100%" shape-rendering="crispEdges">
    <g style="mix-blend-mode:screen;opacity:.75">${markRects(dx, drop, -1, "#ff6b5e", true)}</g>
    <g style="mix-blend-mode:screen;opacity:.75">${markRects(dx, drop, 1, "#6fe3ff", true)}</g>
    <g filter="drop-shadow(0 0 .5px #b8f5c8)">${markRects(dx, drop, 0, hot ? "#f4fff6" : "#b8f5c8", false)}</g></svg>`;
}
let markBusy = false;
function glitchMark() {
  if (!fx() || markBusy) return;
  markBusy = true;
  const n = 4 + Math.floor(Math.random() * 4);
  for (let f = 0; f < n; f++) setTimeout(() => drawMark(true), f * 55);
  setTimeout(() => { drawMark(false); markBusy = false; }, n * 55);
}
drawMark(false);
setTimeout(glitchMark, 900);

// Favicon: the sliced E on a dark tile (readable on light tab bars); amber while anything needs you.
let faviconColor = null;
function setFavicon(color) {
  if (color === faviconColor) return;
  faviconColor = color;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">` +
    `${markRects(SLICED, new Set(), 0, color, false, 2)}</svg>`;
  document.getElementById("favicon").href = "data:image/svg+xml," + encodeURIComponent(svg);
}
setFavicon("#b8f5c8");

function jump(el) {
  if (mode === "demo") return; // fixture ids aren't real; don't pull cmux forward
  el.animate?.([{ boxShadow: "0 0 0 2px #e6ffe9, 0 0 28px #b8f5c8" }, { boxShadow: "0 0 0 0 transparent" }], { duration: 520 });
  fetch("/jump", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ wid: el.dataset.wid, surface: el.dataset.surface }) }).catch(() => {});
}
document.addEventListener("click", (e) => {
  if (e.target.closest("a[href]")) return;
  const lane = e.target.closest(".sec-head[data-lane]");
  if (lane) return toggleLane(lane.dataset.lane);
  const c = e.target.closest(".card");
  if (c && !window.getSelection().toString()) jump(c);
});
document.addEventListener("keydown", (e) => {
  const lane = e.target.closest?.(".sec-head[data-lane]");
  if (lane && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); return toggleLane(lane.dataset.lane); }
  const c = e.target.closest?.(".card");
  if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); jump(c); }
});

// View prefs, each a body class: layout (board|list), density (full|compact), crt (crt-full|crt-low|crt-off).
const PREFS = { layout: ["board", "list"], density: ["full", "compact"], crt: ["crt-full", "crt-low", "crt-off"] };
function setPref(kind, value) {
  document.body.classList.remove(...PREFS[kind]);
  document.body.classList.add(value);
  for (const b of document.querySelectorAll(`[data-${kind}]`)) b.setAttribute("aria-pressed", b.dataset[kind] === value);
  try { localStorage.setItem("hud." + kind, value); } catch {}
  if (kind === "crt") { typeFrame(); if (!fx()) for (const el of document.querySelectorAll(".spin")) el.textContent = "▶"; }
}
for (const kind of Object.keys(PREFS)) {
  document.querySelectorAll(`[data-${kind}]`).forEach((b) => b.addEventListener("click", () => setPref(kind, b.dataset[kind])));
  let saved = null;
  try { saved = localStorage.getItem("hud." + kind); } catch {}
  setPref(kind, PREFS[kind].includes(saved) ? saved : PREFS[kind][0]);
}

function setConn(kind, text) {
  const el = document.getElementById("connLabel");
  el.className = kind;
  document.getElementById("connText").textContent = text;
}
function receive(data) { state = data; recvAt = Date.now() / 1000; render(); }

// Demo mode (?demo, or no /stream): replays hud-fixture.json with a simulated working agent.
const TOOLS = [["Bash", "npx supabase status -o json"], ["Read", "supabase/config.toml"], ["Grep", "email_provider_disabled -r supabase/"], ["Edit", "tests/e2e/global-setup.ts"], ["Bash", "pnpm playwright test --project=seed"]];
function simulate(base, el) {
  const s = JSON.parse(JSON.stringify(base));
  s.now = base.now + el;
  const w = s.groups.working?.[0];
  if (w) {
    const ph = el % 30, n = Math.floor(el / 30), t = w.detail.transcript, h = w.detail.hook;
    if (ph < 20) { const [name, summary] = TOOLS[(Math.floor(ph / 4) + n * 5) % TOOLS.length]; h.tool = name; t.pending_tool = { name, summary }; }
    else {
      s.groups.working.shift(); w.state = "needs_input"; w.since = base.now + n * 30 + 20;
      t.pending_tool = { name: "Bash", summary: "supabase auth admin generate-link --type magiclink --email seed-client@example.test" };
      s.groups.needs_input.push(w);
    }
  }
  for (const k of ORDER) s.totals[k] = (s.groups[k] || []).length;
  return s;
}
let demoTimer = null;
function startDemo() {
  if (demoTimer || mode === "live") return;
  mode = "demo";
  // fixture.js (docs/design-handoff/make_fixture.py) calls window.entropyFixture(payload).
  window.entropyFixture = (fx0) => {
    if (mode !== "demo") return;
    const t0 = Date.now() / 1000;
    setConn("demo", "DEMO · FIXTURE");
    const step = () => receive(simulate(fx0, Math.floor(Date.now() / 1000 - t0)));
    step(); demoTimer = setInterval(step, 1000);
  };
  const tag = document.createElement("script");
  tag.src = "fixture.js";
  tag.onerror = () => setConn("down", "OFFLINE — RETRYING");
  document.head.appendChild(tag);
}

function connect() {
  const es = new EventSource("/stream");
  let got = false;
  es.onopen = () => setConn("", "LIVE");
  es.onmessage = (m) => {
    got = true; mode = "live";
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
    setConn("", "LIVE");
    receive(JSON.parse(m.data));
  };
  // No first message → fall back to the fixture (labelled DEMO). The stream keeps retrying and takes over when it delivers.
  es.onerror = () => { if (!got) startDemo(); else setConn("down", "OFFLINE — RETRYING"); };
  setTimeout(() => { if (!got) startDemo(); }, 2500);
}
const q = new URLSearchParams(location.search);
if (q.has("demo") || q.has("fixture") || location.protocol === "file:") startDemo(); else connect();
</script>
</body>
</html>
